<!DOCTYPE html>
<html>
<body>
<script>
    let nums = [];

    while (true) {
        let n = Number(prompt("Enter number"));
        if (nums.includes(n)) {
            console.log("Number already given");
            break;
        }
        nums.push(n);
    }

    nums.sort((a, b) => a - b);
    console.log(nums);
</script>
</body>
</html>
