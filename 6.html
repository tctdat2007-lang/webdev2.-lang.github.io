<!DOCTYPE html>
<html>
<body>
<script>
    function rollDice() {
        return Math.floor(Math.random() * 6) + 1;
    }

    let result;
    let ul = "<ul>";

    do {
        result = rollDice();
        ul += "<li>" + result + "</li>";
    } while (result !== 6);

    ul += "</ul>";
    document.body.innerHTML = ul;
</script>
</body>
</html>
