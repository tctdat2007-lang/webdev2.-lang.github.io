<!DOCTYPE html>
<html>
<body>
<script>
    function rollDice(sides) {
        return Math.floor(Math.random() * sides) + 1;
    }

    let sides = Number(prompt("Number of sides"));
    let roll;
    let results = [];

    do {
        roll = rollDice(sides);
        results.push(roll);
    } while (roll !== sides);

    console.log(results);
</script>
</body>
</html>
